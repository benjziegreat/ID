                    var fitTextInBox_maxWidth = false;
                    var fitTextInBox_maxHeight = false;
                    var fitTextInBox_currentWidth = false;
                    var fitTextInBox_currentBox = false;
                    var fitTextInBox_currentTextObj = false;
                    function fitTextInBox(divID, maxHeight)
                    {
                        if (maxHeight)
                            fitTextInBox_maxHeight = maxHeight;
                        else
                            fitTextInBox_maxHeight = 10000;
                        var obj = document.getElementById(divID);
                        fitTextInBox_maxWidth = obj.offsetWidth;
                        fitTextInBox_currentBox = obj;
                        fitTextInBox_currentTextObj = obj.getElementsByTagName('SPAN')[0];
                        console.log(fitTextInBox_currentTextObj);
                        fitTextInBox_currentTextObj.style.fontSize = '1px';
                        fitTextInBox_currentWidth = fitTextInBox_currentTextObj.offsetWidth;
                        fitTextInBoxAutoFit();

                    }

                    function fitTextInBoxAutoFit()
                    {
                        var tmpFontSize = fitTextInBox_currentTextObj.style.fontSize.replace('px', '') / 1;
                        fitTextInBox_currentTextObj.style.fontSize = tmpFontSize + 1 + 'px';
                        var tmpWidth = fitTextInBox_currentTextObj.offsetWidth;
                        var tmpHeight = fitTextInBox_currentTextObj.offsetHeight;
                        if (tmpWidth >= fitTextInBox_currentWidth && tmpWidth < fitTextInBox_maxWidth && tmpHeight < fitTextInBox_maxHeight && tmpFontSize < 300) {
                            fitTextInBox_currentWidth = fitTextInBox_currentTextObj.offsetWidth;
                            fitTextInBoxAutoFit();
                        } else {
                            fitTextInBox_currentTextObj.style.fontSize = fitTextInBox_currentTextObj.style.fontSize.replace('px', '') / 1 - 1 + 'px';
                        }
                    }



    </script>
    <script>
        $(document).ready(function() {
          //  $('#linear').signaturePad({drawOnly: true, lineTop: 200, lineColour: 'transparent', bgColour: 'transparent', penColour: '#3d0b0c'});
            $('#smoothed').signaturePad({drawOnly: true, drawBezierCurves: true, lineTop: 200, penWidth: 12, lineColour: 'transparent', bgColour: 'transparent', penColour: 'black'});
            //$('#smoothed-variableStrokeWidth').signaturePad({drawOnly: true, drawBezierCurves: true, variableStrokeWidth: true, lineTop: 200, lineColour: 'black', bgColour: 'transparent', penColour: '#145394'});
            resizeCanvas();
            onresize = function() {
                resizeCanvas();
            };
        });
        function resizeCanvas() {
            $('#smoothed canvas').attr('height', ($('#smoothed').width()+200 - ($('#smoothed').width() * 0.005)) /3.5);
            $('#smoothed canvas').attr('width', ($('#smoothed').width() - ($('#smoothed').width() * 0.005)));
            $('#smoothed hr').css('width', ($('#smoothed').width() - ($('#smoothed').width() * 0.005)));
            $('#divSignatureHere').css('width', ($('#smoothed').width() - ($('#smoothed').width() * 0.580)));
            fitTextInBox('divSignatureHere');
            $('#smoothed #divSignatureHere').css({"top": $('#smoothed hr').position().top + 200 + "px"})
        }
        function uploadEx() {

            var canvas = document.getElementById("canvas");
            var dataURL = canvas.toDataURL("image/png");
            document.getElementById('hidden_data').value = dataURL;
            var fd = new FormData(document.forms["form1"]);

            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'upload_data_employee.php', true);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    var percentComplete = (e.loaded / e.total) * 100;
                    console.log(percentComplete + '% uploaded');
//                    console.log(e);
                    alert('Succesfully uploaded' );
                }
            };

            xhr.onload = function() {

            };
            xhr.send(fd);
        }
        

    </script>
